services:
  app:
    image: ${DOCKERHUB_USERNAME}/everytime:latest
    container_name: everytime-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: everytime-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
