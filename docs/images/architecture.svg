<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 305" width="960" height="305" role="img" aria-labelledby="title desc">
  <title id="title">Everytime Server Architecture</title>
  <desc id="desc">Mobile clients send HTTP requests to Spring Boot. The proposed server layers are Controller, Service and Repository. MySQL stores application data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1l6 3-6 3" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="960" height="305" rx="16" fill="#fff"/>
  <rect x="1" y="1" width="958" height="303" rx="15" fill="none" stroke="#dbe1e8"/>
  <rect x="230" y="58" width="500" height="197" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
  <g fill="#fff" stroke="#cbd5e1">
    <rect x="25" y="120" width="127" height="80" rx="8"/>
    <rect x="250" y="120" width="132" height="80" rx="8"/>
    <rect x="414" y="120" width="132" height="80" rx="8"/>
    <rect x="578" y="120" width="132" height="80" rx="8"/>
    <rect x="808" y="120" width="127" height="80" rx="8"/>
  </g>
  <g stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)">
    <path d="M160 160h61"/><path d="M389 160h17"/><path d="M553 160h17"/><path d="M739 160h61"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#172033" font-weight="650">
      <text x="480" y="35" font-size="19">Everytime Server Architecture</text>
      <text x="480" y="90" font-size="19">Spring Boot</text>
      <g font-size="16">
        <text x="88" y="154">Mobile App</text><text x="316" y="154">Controller</text>
        <text x="480" y="154">Service</text><text x="644" y="154">Repository</text><text x="871" y="154">MySQL</text>
      </g>
    </g>
    <g fill="#475569" font-size="12">
      <text x="88" y="177">Android · iOS</text><text x="316" y="177">Request / Response</text>
      <text x="480" y="177">Business Rules</text><text x="644" y="177">Data Access</text><text x="871" y="177">Database</text>
      <text x="191" y="146">HTTP</text><text x="770" y="146">SQL</text>
      <text x="480" y="232">Proposed application layers</text>
    </g>
  </g>
</svg>
